[project]
name = "screenshot-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "markhristov", email = "marki.v.hristov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.0.0",
    "fsspec>=2026.6.0",
    "huggingface-hub>=1.28.0",
    "numpy>=2.5.2",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "opencv-python>=5.0.0.93",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "skl2onnx>=1.20.0",
]

[project.scripts]
screenshot-classifier = "screenshot_classifier:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
